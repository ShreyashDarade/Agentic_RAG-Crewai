# Server plus Milvus standalone. Secrets come from the environment (see .env.example); nothing is committed.
services:
  milvus:
    extends:
      file: deploy/milvus-standalone.yml
      service: milvus
    volumes:
      - milvus-data:/var/lib/milvus
  api:
    build: .
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      AGENTIC_RAG_API_KEYS: ${AGENTIC_RAG_API_KEYS:?set AGENTIC_RAG_API_KEYS}
      AGENTIC_RAG_OPENAI_API_KEY: ${AGENTIC_RAG_OPENAI_API_KEY:?set AGENTIC_RAG_OPENAI_API_KEY}
      AGENTIC_RAG_MILVUS_URI: http://milvus:19530
    ports:
      - "8000:8000"
volumes:
  milvus-data: {}
