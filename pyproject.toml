[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering: HTTP service, Python SDK and in-process engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
engine = [
    "pydantic-settings>=2.4,<3",
    "pymilvus>=2.5,<4",
    "openai>=1.60,<3",
    "numpy>=1.26",
]
parsers = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]
server = [
    "agentic-rag[engine]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
worker = ["agentic-rag[engine]"]
crewai = ["agentic-rag[engine]", "crewai>=1.14,<2"]
ocr = ["agentic-rag[engine]", "easyocr>=1.7", "opencv-python-headless>=4.8"]
rerank = ["agentic-rag[engine]", "sentence-transformers>=3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "griffe>=1.5",
    "pip-audit>=2.7",
    "milvus-lite>=2.4; sys_platform == 'linux'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "milvus: needs a Milvus engine (Milvus Lite locally, standalone in CI)",
    "slow: long-running tests, excluded from the default run",
]
filterwarnings = ["error::DeprecationWarning:agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "C4", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["agentic_rag"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pymilvus.*", "pymupdf.*", "fitz.*", "docx.*", "pptx.*", "openpyxl.*", "bs4.*", "lxml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["agentic_rag"]
branch = true
